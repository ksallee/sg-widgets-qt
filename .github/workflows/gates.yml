# ruff, then the suite on both bindings. A change is merged when this is green.
#
# GitHub-hosted, not self-hosted. This repository is public, so anyone can open a pull request and a
# `pull_request` workflow runs that pull request's code. On a self-hosted runner that is arbitrary code
# execution on the machine hosting it, and a runner is not ephemeral, so a compromise persists into every
# later run. GitHub-hosted minutes are free and unmetered for public repositories on standard runners,
# which ubuntu-latest is, so this bills nothing. Larger runners bill even on a public repository.
#
# No gate needs a credential. The live reads do, and they are not gates: they are marked `live` and
# `pytest` with no marker expression never reaches the network.
#
# Two environments, because the widgets run on Qt 5 and Qt 6 and qtpy hides the difference only where
# the code asks it to. PySide6 6.7 is the last release for Python 3.9; PyQt5 stands in for PySide2,
# which ships no arm64 wheel. The matrix runs them side by side and `fail-fast` is off, so a break in
# one binding still reports the other.
#
# Qt draws nothing here: `QT_QPA_PLATFORM=offscreen` picks the platform plugin that paints into memory.
# It still links the Qt libraries below, which a GitHub runner does not carry, and a missing one reads
# as "could not load the Qt platform plugin" with no name in it.

name: Gates

on:
  pull_request:
  push:
    # `dev` is where the work happens and `main` is what a release is cut from, so a push to either is
    # checked without waiting for a pull request to open.
    branches: [main, dev]

concurrency:
  group: gates-${{ github.ref }}
  # A new commit supersedes the run before it. A label change does not: it fires `labeled`, which would
  # kill the run `opened` started seconds earlier and print as a failure with no failing step.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  # Python 3.9 is the floor: Maya 2023, Houdini 19.5 and Nuke 14 ship it. The runner's own Python
  # satisfies `requires-python`, so without this uv would take it and the floor would go untested.
  UV_PYTHON: "3.9"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run ruff check src tests tools

  tests:
    name: pytest on ${{ matrix.binding }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - binding: PySide6
            qt_api: pyside6
            sync: uv sync
            python: .venv/bin/python
          - binding: PyQt5
            qt_api: pyqt5
            sync: UV_PROJECT_ENVIRONMENT=.venv-qt5 uv sync --no-group dev --group qt5
            python: .venv-qt5/bin/python
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.qt_api }}
    steps:
      - uses: actions/checkout@v5

      - name: The libraries the offscreen platform plugin links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: ${{ matrix.sync }}
      - run: ${{ matrix.python }} -m pytest
