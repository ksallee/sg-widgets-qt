# Publish to PyPI when a GitHub release is published. Nothing else triggers it: a tag alone does not,
# so a mistyped tag costs nothing and the release notes are written before anything ships.
#
# No token anywhere. PyPI Trusted Publishing exchanges this workflow's OIDC identity for a short-lived
# upload token, which is why `id-token: write` is here and no secret is. It has to be configured once
# on PyPI, under the project's Publishing settings:
#
#   owner              ksallee
#   repository         sg-widgets-qt
#   workflow           release.yml
#   environment        pypi
#
# The `pypi` environment is the second half of that: with it set, only a run in that environment can
# claim the identity, so a workflow added by a pull request cannot publish.
#
# The version published is `[project].version` in pyproject.toml, and the entry under it in
# CHANGELOG.md is what the release notes say. PyPI refuses a version it already has, so bump it in the
# same commit as the release, and never re-point a tag at new code.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: The libraries the offscreen platform plugin links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libfreetype6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The gates run the suite from the checkout. This builds the wheel and the sdist from the tagged
      # tree, because that is the tree being published and no other run has seen it.
      - run: uv build

      - name: The wheel imports before anyone can install it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv /tmp/v
          # The extra brings a binding, because the wheel names none: a host supplies Qt.
          /tmp/v/bin/pip -q install "$(ls dist/*.whl)[pyside6]"
          cd /tmp && /tmp/v/bin/python -c "
          from pathlib import Path
          import sg_widgets_core, sg_widgets_qt
          from sg_widgets_core import MockClient, create_sg_context
          from sg_widgets_qt.widgets.entity_picker import EntityPicker
          for package in (sg_widgets_core, sg_widgets_qt):
              assert (Path(package.__file__).parent / 'py.typed').is_file(), package.__name__
          create_sg_context(MockClient())
          print('ok')
          "

      - uses: pypa/gh-action-pypi-publish@release/v1
