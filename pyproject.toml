[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-widgets-qt"
version = "0.1.1"
description = "Flow Production Tracking widgets for Qt, a port of sg-widgets on qtpy and shotgun_api3"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Sallee" }]
keywords = ["shotgrid", "shotgun", "flow-production-tracking", "qt", "pyside", "pyqt", "vfx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "qtpy>=2.4",
    "shotgun_api3>=3.5",
]

[project.optional-dependencies]
pyside6 = ["PySide6"]
pyqt5 = ["PyQt5"]

[project.scripts]
sg-widgets-showcase = "sg_widgets_qt.showcase.__main__:main"

[project.urls]
Homepage = "https://github.com/ksallee/sg-widgets-qt"
Documentation = "https://github.com/ksallee/sg-widgets-qt/tree/main/docs"
Issues = "https://github.com/ksallee/sg-widgets-qt/issues"
Changelog = "https://github.com/ksallee/sg-widgets-qt/blob/main/CHANGELOG.md"
Source = "https://github.com/ksallee/sg-widgets-qt"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_widgets_core", "src/sg_widgets_qt"]

# The sdist carries what builds the wheel and what checks it: the two packages, the suites, the
# docs the showcase reads, and the tools. The screenshots, the qa drives and the live reads are
# none of those, and they are most of the tree.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "tools/",
    "sync/manifest.json",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]
exclude = [
    "tools/drives/",
    "tests/live/",
    "**/__pycache__/",
]

# The showcase draws its pages from docs/. They are written there and copied into the package, so
# an installed showcase has them and `sg_widgets_qt.showcase.paths` reads them from either place.
[tool.hatch.build.targets.wheel.force-include]
"docs/core" = "sg_widgets_qt/_docs/core"
"docs/start" = "sg_widgets_qt/_docs/start"
"docs/widgets" = "sg_widgets_qt/_docs/widgets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# A widget test that waits on a signal that never comes hangs the whole run. Nothing here takes
# more than a few seconds, so a test still going after two minutes has stopped waiting for
# anything a rerun would fix.
timeout = 120

markers = [
    "live: reads the test site over the network, skipped without .env.local",
    "slow: builds a wheel and a venv of its own",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2",
    "PySide6>=6.7,<6.8",
    "ruff>=0.6",
]
qt5 = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2",
    "PyQt5>=5.15.11",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
